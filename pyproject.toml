[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uz-tts"
version = "0.1.0"
description = "Ifodali o'zbekcha TTS — data pipeline, train va baholash"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Rustamjon Nuriddinov" }]
dependencies = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.24.0.43",
    "pydantic>=2.9",
    "silero-vad>=6.2.1",
    "transformers>=5.14.1",
    "typer>=0.12",
    "yt-dlp>=2024.12.13",
]

[project.scripts]
uztts-data = "uztts_data.cli:app"
uztts-ingest = "uztts_data.ingest:app"
uztts-segment = "uztts_data.segment:app"
uztts-transcribe = "uztts_data.transcribe:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uztts_data"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ANN", "B", "C4", "E", "F", "I", "N", "PTH", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*", "silero_vad.*", "torchaudio.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
