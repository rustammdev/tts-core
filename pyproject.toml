[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uz-tts"
version = "0.1.0"
description = "Ifodali o'zbekcha TTS — data pipeline, train va baholash"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Rustamjon Nuriddinov" }]
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    "hydra-core>=1.3.5",
    "jiwer>=4.0.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.24.0.43",
    "omegaconf>=2.3.1",
    "pyannote-audio>=4.0.7",
    "pydantic>=2.9",
    "sentencepiece>=0.2.2",
    "silero-vad>=6.2.1",
    "soundfile>=0.14.0",
    "transformers>=5.14.1",
    "typer>=0.12",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "yt-dlp>=2024.12.13",
]

[project.scripts]
uztts-data = "uztts_data.cli:app"
uztts-ingest = "uztts_data.ingest:app"
uztts-segment = "uztts_data.segment:app"
uztts-transcribe = "uztts_data.transcribe:app"
uztts-asr = "uztts_asr.cli:app"
uztts-events = "uztts_events.cli:app"
uztts-text = "uztts_text.cli:app"
uztts-serve = "uztts_serve.app:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/uztts_data",
    "src/uztts_asr",
    "src/uztts_events",
    "src/uztts_text",
    "src/uztts_serve",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/uztts_events/_vendor"]

[tool.ruff.lint]
select = ["ANN", "B", "C4", "E", "F", "I", "N", "PTH", "RUF", "SIM", "UP"]
allowed-confusables = ["ʻ", "ʼ", "’", "‘", "´", "—", "–"]

[tool.ruff.lint.per-file-ignores]
"src/uztts_text/translit.py" = ["RUF001"]
"src/uztts_text/apostrophes.py" = ["RUF001"]
"tests/text/*" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "yt_dlp.*",
    "silero_vad.*",
    "torchaudio.*",
    "faster_whisper.*",
    "av.*",
    "pyarrow.*",
    "soundfile.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["uztts_events._vendor.*"]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
